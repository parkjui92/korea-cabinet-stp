# 부처 정규화 테이블
#
# 왜 필요한가: 같은 조직이 시점마다 다른 이름으로 문서에 등장한다. 문자열로
# 집계하면 조직개편일에 시계열이 끊기고, 개편 전후를 그냥 이으면 서로 다른
# 범위의 조직을 같은 것으로 착각한다.
#
# `lineage`의 kind가 rename이 아니면 **집계 시 주의가 필요하다**. 특히
# 산업통상자원부→산업통상부는 개명처럼 보이지만 에너지 기능이 통째로 빠져
# 나갔다. 이 경계를 모르고 R&D·에너지 의제 점유를 시계열로 그리면 2025-10-01에
# 원인 모를 급락이 생긴다.
#
# 출처: 정부조직법 개정(2025-09-26 국회 통과, 2025-10-01 시행 / 기재부 분리는
# 2026-01-02 시행). 날짜는 뉴스 확인값이며, 수집된 문서의 실제 등장 시점과
# 대조해 검증한다(validate_against_observed).

meta:
  verified_on: 2026-07-22
  confidence: 뉴스 교차확인 — 관보 원문 대조 미완

