# 과학기술정책 주제 태그 사전
#
# 소관부처만으로는 과기정책의 급소를 놓친다. 실측 근거:
# opencabinet 지시-이행 트래커에서 과기정통부는 3건뿐인데 산업부는 17건이다.
# 과기정통부 신호는 지시가 아니라 다른 곳(AI·데이터 발언)에 몰려 있었다.
# R&D 예산은 기재부·기획예산처, 규제 합리화는 국무조정실 소관으로 잡힌다.
#
# 그래서 2축으로 판정한다.
#   1축 소관부처 화이트리스트 (ministries.yaml의 science_tech_core/adjacent)
#   2축 여기의 주제 태그
#
# `any`가 하나라도 걸리면 후보, `strong`이 걸리면 단독으로도 관련 판정.
# `exclude`는 같은 단어가 다른 뜻으로 쓰이는 경우를 걷어낸다.

tags:
  AI:
    strong: [인공지능, AI기본법, 생성형AI, 초거대AI, 소버린AI, AI반도체, 머신러닝, 딥러닝]
    any: [AI, 알고리즘, 자율주행, 로봇, 휴머노이드, 챗봇]
    exclude: []   # 'AI'는 짧아 오탐이 나므로 단어 경계로만 매칭한다

  데이터:
    strong: [데이터경제, 데이터산업, 마이데이터, 국가데이터, 공공데이터, 가명정보, 데이터센터]
    any: [빅데이터, 데이터, 통계, 개인정보, 정보보호]

  반도체:
    strong: [반도체, 시스템반도체, 전력반도체, 파운드리, 팹]
    # 희토류 등 핵심광물은 반도체·배터리 공급망의 원료라 실질적으로 과기
    # 산업정책이다(예: motie의 「희토류 공급망 안정화 대책」).
    any: [소자, 웨이퍼, 첨단패키징, 희토류, 핵심광물, 공급망안정화]

  R&D예산:
    strong: [연구개발예산, R&D예산, 연구개발비, 국가연구개발, 예비타당성조사, 예타]
    any: [연구개발, 출연연, 연구비, 과학기술기본계획, 기초연구]

  에너지:
    # `전력`을 단독으로 넣으면 안 된다. 全力(전력투구·전력해 주시기)과 동음이의어라
    # 실측 11회 중 5회가 오탐이었다. 電力 의미가 확정되는 복합어만 쓴다.
    strong: [원자력, 원전, 재생에너지, 수소경제, 탄소중립, 전력수급, 전력망, 전력계통]
    any: [에너지, 발전소, 태양광, 풍력, 배터리, 이차전지, 송전, 전력산업]

  바이오:
    strong: [바이오헬스, 신약개발, 첨단재생의료, 유전자, 합성생물학]
    any: [제약, 바이오, 백신, 의료기기]

  우주항공:
    strong: [우주항공, 위성, 발사체, 우주개발, 도심항공교통, UAM]
    any: [항공, 우주]

  디지털전환:
    strong: [디지털전환, 디지털정부, 지능정보, 클라우드, 사이버보안]
    any: [디지털, 정보통신, 네트워크, 6G, 5G, 플랫폼]

  과학기술인재:
    strong: [이공계인재, 과학기술인재, 연구인력, 이공계]
    any: [인재양성, 대학원, 지역인재, 산학협력]

  지식재산:
    strong: [지식재산, 특허, 기술이전, 기술사업화, 기술탈취, 기술유출, 산업기술보호]
    any: [상표, 디자인권, 영업비밀]

  규제혁신:
    strong: [규제샌드박스, 규제자유특구, 규제혁신, 네거티브규제]
    any: [규제합리화, 규제개선, 실증특례]

# 판정 규칙
#   핵심: 소관이 science_tech_core  또는  strong 태그 적중
#   연관: 소관이 science_tech_adjacent 이면서 any 태그 적중
#   무관: 그 외
# 판정 근거(어느 축·어느 키워드로 걸렸는지)를 함께 저장해 사후 감사가 가능하게 한다.
rules:
  core_requires: [ministry_core, strong_tag]
  adjacent_requires_both: true
